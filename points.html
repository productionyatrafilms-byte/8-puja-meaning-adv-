<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Puja Meaning</title>
    <link rel="stylesheet" href="./assets/plugins/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/points.css">
</head>

<body id="body" class="points-page">

    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <a class="stage-item back-btn" href="./index.html">
        <img src="./assets/images/home.png" alt="Home">
    </a>

    <img class="page-bg" src="./assets/images/bg-points.png" alt="">

    <div class="main-container">
        <div class="stage">
            <img class="stage-spacer" src="./assets/images/stage-spacer.png" alt="">

            <div class="stage-item flower flower-left">
                <img src="./assets/images/flower.png" alt="">
            </div>
            <div class="stage-item flower flower-right">
                <img src="./assets/images/flower.png" alt="">
            </div>

            <div class="stage-item slide-frame">
                <img src="./assets/images/slideframe.png" alt="">
            </div>

            <h1 class="page-title" data-text="pointsPage.title"></h1>

            <div class="puja-name">
                <img class="puja-name-deco" src="./assets/images/decoleft.png" alt="">
                <div class="puja-name-list">
                    <h2 class="puja-name-item is-active" data-text="pujas.0.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.1.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.2.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.3.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.4.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.5.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.6.name"></h2>
                    <h2 class="puja-name-item" data-text="pujas.7.name"></h2>
                </div>
                <img class="puja-name-deco" src="./assets/images/decoright.png" alt="">
            </div>

            <div class="slider-wrapper">
                <div class="swiper puja-swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="./assets/images/points/1.png" alt="Jal Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/2.png" alt="Chandan Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/3.png" alt="Phool Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/4.png" alt="Dhoop Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/5.png" alt="Deepak Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/6.png" alt="Akshat Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/7.png" alt="Naivedya Puja"></div>
                        <div class="swiper-slide"><img src="./assets/images/points/8.png" alt="Fal Puja"></div>
                    </div>
                </div>
                <div class="slider-border"></div>
            </div>

            <div class="btn-prev"><img src="./assets/images/prev.png" alt="Previous"></div>
            <div class="btn-next"><img src="./assets/images/next.png" alt="Next"></div>

            <div class="stage-item text-frame">
                <img src="./assets/images/textframe-tall.png" alt="">

                <div class="meaning">
                    <p class="meaning-item is-active" data-text="pujas.0.meaning"></p>
                    <p class="meaning-item" data-text="pujas.1.meaning"></p>
                    <p class="meaning-item" data-text="pujas.2.meaning"></p>
                    <p class="meaning-item" data-text="pujas.3.meaning"></p>
                    <p class="meaning-item" data-text="pujas.4.meaning"></p>
                    <p class="meaning-item" data-text="pujas.5.meaning"></p>
                    <p class="meaning-item" data-text="pujas.6.meaning"></p>
                    <p class="meaning-item" data-text="pujas.7.meaning"></p>
                </div>
            </div>

            <a class="pranam-end-link" href="./pranam.html" tabindex="-1">
                <img src="./assets/images/arowAsset.png" alt="">
                <span class="pranam-end-link-label" data-text="pranam.arrowLabel"></span>
            </a>

        </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/text.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/points.js"></script>
</body>

</html>
